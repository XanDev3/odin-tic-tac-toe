<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Project</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?display=swap">
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@100;400;500;600&family=Mochiy+Pop+One&family=Permanent+Marker&family=Roboto:ital,wght@0,100;0,500;0,700;1,100&family=Fraunces&family=Poppins:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:ital,wght@0,200;0,300;0,400;1,200;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap'"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/35d8074e8c.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Tic-Tac-Toe</h1>
        </header>
    <main>
        <div class="player-message">Player X's turn</div>
        <div class="gameboard">
            <div class="box" data-index="0"></div>
            <div class="box" data-index="1"></div>
            <div class="box" data-index="2"></div>
            <div class="box" data-index="3"></div>
            <div class="box" data-index="4"></div>
            <div class="box" data-index="5"></div>
            <div class="box" data-index="6"></div>
            <div class="box" data-index="7"></div>
            <div class="box" data-index="8"></div>
        </div>
        <div class="center">
            <button type="button" class="reset-button">Restart</button>
        </div>
    </main>
    <footer class="footer">
        <p>
        <a href="https://github.com/xandev3/odin-tic-tac-toe/" target="_blank">
            <img class="xn-github" src="GitHub-Mark-64px.png" height="32" width="32" alt="fa-github">
            &nbsp;Xander&nbsp;© 2022
        </a>
    </p>
    </footer>    
    <script src="app.js"></script>

</body>
</html>
